<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c96a"/>
      <stop offset="0.45" stop-color="#c8991b"/>
      <stop offset="1" stop-color="#9c7409"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="#ffffff"/>

  <!-- handle -->
  <path d="M24 15 v-3 a3 3 0 0 1 3-3 h10 a3 3 0 0 1 3 3 v3" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>

  <!-- case body -->
  <rect x="13" y="15" width="38" height="40" rx="7" fill="#0f1c36"/>
  <g stroke="#1c2c4c" stroke-width="1.8" opacity="0.7">
    <line x1="22" y1="20" x2="22" y2="50"/>
    <line x1="42" y1="20" x2="42" y2="50"/>
  </g>

  <!-- corner guards -->
  <path d="M13 22 a7 7 0 0 1 7-7 h3 v4 h-10 z" fill="url(#g)"/>
  <path d="M51 22 a7 7 0 0 0-7-7 h-3 v4 h10 z" fill="url(#g)"/>
  <path d="M13 48 a7 7 0 0 0 7 7 h3 v-4 h-10 z" fill="url(#g)"/>
  <path d="M51 48 a7 7 0 0 1-7 7 h-3 v-4 h10 z" fill="url(#g)"/>

  <!-- stars -->
  <path d="M22 25 l.8 1.7 1.9.25-1.4 1.3.3 1.9-1.6-.9-1.6.9.3-1.9-1.4-1.3 1.9-.25z" fill="#e9c96a"/>
  <path d="M42 25 l.8 1.7 1.9.25-1.4 1.3.3 1.9-1.6-.9-1.6.9.3-1.9-1.4-1.3 1.9-.25z" fill="#e9c96a"/>

  <!-- gold 5 -->
  <text x="32" y="49" text-anchor="middle" font-family="Marcellus, 'Times New Roman', serif" font-size="26" fill="url(#g)">5</text>

  <!-- wheels -->
  <circle cx="22" cy="58" r="3.2" fill="#0f1c36" stroke="url(#g)" stroke-width="1.4"/>
  <circle cx="42" cy="58" r="3.2" fill="#0f1c36" stroke="url(#g)" stroke-width="1.4"/>
</svg>
