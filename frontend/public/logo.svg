<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 8 296 74" role="img" aria-label="5Star - Bags, Jerkins and Trolleys">
  <defs>
    <linearGradient id="fsGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c96a"/>
      <stop offset="0.45" stop-color="#c8991b"/>
      <stop offset="1" stop-color="#9c7409"/>
    </linearGradient>
    <linearGradient id="fsGoldSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2dd9a"/>
      <stop offset="1" stop-color="#cfa02a"/>
    </linearGradient>
  </defs>

  <!-- ===== Emblem: navy suitcase with gold 5 + star arc ===== -->
  <g>
    <!-- handle -->
    <path d="M30 20 v-4 a4 4 0 0 1 4-4 h14 a4 4 0 0 1 4 4 v4" fill="none" stroke="url(#fsGold)" stroke-width="3.4" stroke-linecap="round"/>

    <!-- case body -->
    <rect x="16" y="20" width="50" height="52" rx="9" fill="#0f1c36"/>
    <rect x="16" y="20" width="50" height="52" rx="9" fill="none" stroke="url(#fsGoldSoft)" stroke-width="1.4" opacity="0.55"/>

    <!-- ribbed shell lines -->
    <g stroke="#1c2c4c" stroke-width="2" opacity="0.7">
      <line x1="27" y1="26" x2="27" y2="66"/>
      <line x1="35" y1="26" x2="35" y2="66"/>
      <line x1="47" y1="26" x2="47" y2="66"/>
      <line x1="55" y1="26" x2="55" y2="66"/>
    </g>

    <!-- corner guards -->
    <path d="M16 29 a9 9 0 0 1 9-9 h4 v5 h-13 z" fill="url(#fsGold)"/>
    <path d="M66 29 a9 9 0 0 0-9-9 h-4 v5 h13 z" fill="url(#fsGold)"/>
    <path d="M16 63 a9 9 0 0 0 9 9 h4 v-5 h-13 z" fill="url(#fsGold)"/>
    <path d="M66 63 a9 9 0 0 1-9 9 h-4 v-5 h13 z" fill="url(#fsGold)"/>

    <!-- star arc over the 5 -->
    <g fill="url(#fsGoldSoft)">
      <path d="M28 34 l1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z" transform="scale(0.62) translate(17 12)"/>
      <path d="M41 30 l1.15 2.4 2.65.38-1.9 1.85.45 2.62-2.35-1.24-2.35 1.24.45-2.62-1.9-1.85 2.65-.38z" transform="scale(0.8) translate(9 4)"/>
      <path d="M54 34 l1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z" transform="scale(0.62) translate(41 12)"/>
    </g>

    <!-- gold 5 -->
    <text x="41" y="62" text-anchor="middle" font-family="Marcellus, 'Times New Roman', serif" font-size="30" fill="url(#fsGold)">5</text>

    <!-- wheels -->
    <circle cx="27" cy="76" r="4" fill="#0f1c36" stroke="url(#fsGold)" stroke-width="1.6"/>
    <circle cx="55" cy="76" r="4" fill="#0f1c36" stroke="url(#fsGold)" stroke-width="1.6"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="86" y="46" font-family="Marcellus, 'Times New Roman', serif" font-size="34" letter-spacing="1"
        fill="#0f1c36">5<tspan fill="#c8991b">STAR</tspan></text>

  <!-- tagline with rules -->
  <g>
    <line x1="87" y1="60" x2="100" y2="60" stroke="#c8991b" stroke-width="1.2"/>
    <text x="104" y="63.5" font-family="Jost, 'Inter', sans-serif" font-size="9" letter-spacing="2.4"
          fill="#5c5342">BAGS</text>
    <path d="M139 60.5 l1 2 2 .3-1.5 1.4.35 2-1.85-1-1.85 1 .35-2-1.5-1.4 2-.3z" fill="#c8991b"/>
    <text x="150" y="63.5" font-family="Jost, 'Inter', sans-serif" font-size="9" letter-spacing="2.4"
          fill="#5c5342">JERKINS</text>
    <path d="M203 60.5 l1 2 2 .3-1.5 1.4.35 2-1.85-1-1.85 1 .35-2-1.5-1.4 2-.3z" fill="#c8991b"/>
    <text x="214" y="63.5" font-family="Jost, 'Inter', sans-serif" font-size="8.6" letter-spacing="2.2"
          fill="#5c5342">TROLLEYS</text>
  </g>
</svg>
